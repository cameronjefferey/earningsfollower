# Render Blueprint for earningsfollower
# Deploy with: https://dashboard.render.com/blueprints (or `render blueprint launch`).
# Postgres holds the data; a daily cron refreshes it; the API and Next.js UI are web services.

databases:
  - name: earningsfollower-db
    plan: free
    region: oregon

services:
  # FastAPI backend
  - type: web
    name: earningsfollower-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: earningsfollower-db
          property: connectionString
      - key: FMP_API_KEY
        sync: false # set in the dashboard
      - key: ENABLE_SCHEDULER
        value: "false" # the cron job below handles refreshes
      - key: HISTORY_YEARS
        value: "5"
      - key: ALPACA_API_KEY
        sync: false # paper key; set in the dashboard
      - key: ALPACA_API_SECRET
        sync: false # paper secret; set in the dashboard
      - key: ALPACA_PAPER
        value: "true"
      # iex = free real-time (IEX-only); set "sip" only with a paid Alpaca
      # market-data sub (auto-falls back to iex if not entitled).
      - key: ALPACA_DATA_FEED
        value: "iex"
      # Paywall off until you configure Google + Stripe (see README).
      - key: PAYWALL_ENABLED
        value: "true"
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_BYPASS_EMAILS
        sync: false
      - key: ADMIN_EMAILS
        sync: false # your Google email(s); Paper/Learning/playbooks
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: PUBLIC_APP_URL
        value: https://www.earningsfollower.com
      - key: API_PUBLIC_URL
        value: https://api.earningsfollower.com
      - key: CORS_ORIGINS
        value: https://earningsfollower.com,https://www.earningsfollower.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CONTACT_INBOX
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # Daily data refresh (earnings, prices, implied move, analyst)
  - type: cron
    name: earningsfollower-refresh
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    schedule: "0 10 * * *" # 10:00 UTC daily
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.refresh --no-peers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: earningsfollower-db
          property: connectionString
      - key: FMP_API_KEY
        sync: false # set in the dashboard
      # The refresh sends the post-refresh notifications: Telegram setup alerts
      # and wave alert emails to Pro users, so it needs the same channels.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: AUTH_SECRET
        sync: false # signs one-click unsubscribe links in wave alert emails
      - key: AUTH_BYPASS_EMAILS
        sync: false # bypass accounts count as Pro for wave alert emails
      - key: PUBLIC_APP_URL
        value: https://www.earningsfollower.com
      - key: API_PUBLIC_URL
        value: https://api.earningsfollower.com

  # Autonomous paper earnings trader (places & manages Alpaca paper trades)
  - type: cron
    name: earningsfollower-paper
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    # Every 30 min during US market hours (13:30-20:00 UTC) on weekdays so the
    # waves bracket (underlying-move take-profit/stop) is checked intraday.
    # Entries are idempotent (one trade per ticker/event, capped by max-open).
    schedule: "*/30 13-20 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.paper_run
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: earningsfollower-db
          property: connectionString
      - key: ALPACA_API_KEY
        sync: false # paper key; set in the dashboard
      - key: ALPACA_API_SECRET
        sync: false # paper secret; set in the dashboard
      - key: ALPACA_PAPER
        value: "true"
      # iex = free real-time (IEX-only); set "sip" only with a paid Alpaca
      # market-data sub (auto-falls back to iex if not entitled).
      - key: ALPACA_DATA_FEED
        value: "iex"
      # Enter an earnings setup when the report is within this many days (wider
      # = positioned earlier, more IV to sell, more pre-print drift risk).
      - key: PAPER_ENTRY_WINDOW_DAYS
        value: "7"
      # Conviction-weighted risk per trade (defaults: high 5% / med 3% / low 1.5%).
      - key: PAPER_RISK_HIGH
        value: "0.05"
      - key: PAPER_RISK_MEDIUM
        value: "0.03"
      - key: PAPER_RISK_LOW
        value: "0.015"
      # Proactive loss-cutting on sell-vol / earnings credit trades (fraction of
      # max risk). Keep on — otherwise winners get clipped and losers run.
      - key: PAPER_STOPS_ENABLED
        value: "true"
      - key: PAPER_STOP_LOSS_FRAC
        value: "0.20"
      - key: PAPER_LATE_STOP_FRAC
        value: "0.10"
      # Waves: directional sympathy-drift trades with an underlying-move bracket.
      - key: PAPER_WAVES_ENABLED
        value: "true"
      - key: PAPER_WAVE_GAIN_PCT
        value: "0.10"
      - key: PAPER_WAVE_LOSS_PCT
        value: "0.05"
      # Drift (PEAD): post-earnings drift via a directional debit spread, exited
      # on a time horizon, take-profit, or broken-thesis stop.
      - key: PAPER_DRIFT_ENABLED
        value: "true"
      - key: PAPER_DRIFT_RISK_FRAC
        value: "0.015"
      - key: PAPER_DRIFT_HOLD_DAYS
        value: "7"
      # Broken-thesis stop only fires this fraction beyond the earnings-day
      # pivot, so noise around the level doesn't whipsaw a fresh entry to a loss.
      - key: PAPER_DRIFT_STOP_BUFFER
        value: "0.015"
      # Fills: entries cross (take the ask / hit the bid + a small buffer) so
      # wide, illiquid spreads fill; exits price at the mid nudged by the buffer
      # so we never dump a held spread to a dead bid. Orders go out only while
      # the market is open. Only filled orders become positions.
      - key: PAPER_MARKET_HOURS_ONLY
        value: "true"
      - key: PAPER_FILL_CROSS
        value: "true"
      - key: PAPER_FILL_BUFFER
        value: "0.03"

  # Next.js frontend
  - type: web
    name: earningsfollower-web
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://api.earningsfollower.com
      - key: NEXT_PUBLIC_PAYWALL_ENABLED
        value: "true"
      - key: AUTH_SECRET
        sync: false # must match API AUTH_SECRET
      - key: AUTH_URL
        value: https://www.earningsfollower.com
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_API_BASE
        value: https://api.earningsfollower.com
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      # Reddit Ads → Events Manager → Pixel ID (rebuild web after setting)
      - key: NEXT_PUBLIC_REDDIT_PIXEL_ID
        sync: false
