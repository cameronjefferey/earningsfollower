# Render Blueprint for earningsfollower
# Deploy with: https://dashboard.render.com/blueprints (or `render blueprint launch`).
# Postgres holds the data; a daily cron refreshes it; the API and Next.js UI are web services.

databases:
  - name: earningsfollower-db
    plan: free
    region: oregon

services:
  # FastAPI backend
  - type: web
    name: earningsfollower-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: earningsfollower-db
          property: connectionString
      - key: FMP_API_KEY
        sync: false # set in the dashboard
      - key: ENABLE_SCHEDULER
        value: "false" # the cron job below handles refreshes
      - key: HISTORY_YEARS
        value: "5"
      - key: ALPACA_API_KEY
        sync: false # paper key; set in the dashboard
      - key: ALPACA_API_SECRET
        sync: false # paper secret; set in the dashboard
      - key: ALPACA_PAPER
        value: "true"
      # iex = free real-time (IEX-only); set "sip" only with a paid Alpaca
      # market-data sub (auto-falls back to iex if not entitled).
      - key: ALPACA_DATA_FEED
        value: "iex"

  # Daily data refresh (earnings, prices, implied move, analyst)
  - type: cron
    name: earningsfollower-refresh
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    schedule: "0 10 * * *" # 10:00 UTC daily
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.refresh --no-peers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: earningsfollower-db
          property: connectionString
      - key: FMP_API_KEY
        sync: false # set in the dashboard

  # Autonomous paper earnings trader (places & manages Alpaca paper trades)
  - type: cron
    name: earningsfollower-paper
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    # Every 30 min during US market hours (13:30-20:00 UTC) on weekdays so the
    # waves bracket (underlying-move take-profit/stop) is checked intraday.
    # Entries are idempotent (one trade per ticker/event, capped by max-open).
    schedule: "*/30 13-20 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.paper_run
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: earningsfollower-db
          property: connectionString
      - key: ALPACA_API_KEY
        sync: false # paper key; set in the dashboard
      - key: ALPACA_API_SECRET
        sync: false # paper secret; set in the dashboard
      - key: ALPACA_PAPER
        value: "true"
      # iex = free real-time (IEX-only); set "sip" only with a paid Alpaca
      # market-data sub (auto-falls back to iex if not entitled).
      - key: ALPACA_DATA_FEED
        value: "iex"
      # Conviction-weighted risk per trade (defaults: high 5% / med 3% / low 1.5%).
      - key: PAPER_RISK_HIGH
        value: "0.05"
      - key: PAPER_RISK_MEDIUM
        value: "0.03"
      - key: PAPER_RISK_LOW
        value: "0.015"
      # Proactive loss-cutting on the sell-vol trades — off to start (exit only
      # after the print). Flip to true to arm the stops.
      - key: PAPER_STOPS_ENABLED
        value: "false"
      # Waves: directional sympathy-drift trades with an underlying-move bracket.
      - key: PAPER_WAVES_ENABLED
        value: "true"
      - key: PAPER_WAVE_GAIN_PCT
        value: "0.10"
      - key: PAPER_WAVE_LOSS_PCT
        value: "0.05"
      # Drift (PEAD): post-earnings drift via a directional debit spread, exited
      # on a time horizon, take-profit, or broken-thesis stop.
      - key: PAPER_DRIFT_ENABLED
        value: "true"
      - key: PAPER_DRIFT_RISK_FRAC
        value: "0.015"
      - key: PAPER_DRIFT_HOLD_DAYS
        value: "7"
      # Fills: price at the marketable cross (take the ask / hit the bid + a
      # small buffer) so wide, illiquid spreads actually fill, and only place
      # orders while the market is open. Only filled orders become positions.
      - key: PAPER_MARKET_HOURS_ONLY
        value: "true"
      - key: PAPER_FILL_CROSS
        value: "true"
      - key: PAPER_FILL_BUFFER
        value: "0.03"

  # Next.js frontend
  - type: web
    name: earningsfollower-web
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://earningsfollower-api.onrender.com
